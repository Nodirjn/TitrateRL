# Sensitivity evaluation (Week 13): the V4-calibrated world (docs/validation.md).
# Cohort with median rho_si 3.0 and 15 % missed injections; agents are NOT retrained.
# Checkpoints are filled in after phase 2 (same list as configs/eval/test_full.yaml).
split: test
n_scenarios: 10
base_seed: 7
n_jobs: 2
cohort:
  rho_si: {median: 3.0, sigma: 0.35}
scenario:
  missed_injection_prob: 0.15
rule_policies: [b0_fixed, b1_atlantus, b2_treat_to_target, b3_insight]
checkpoints:
  - {policy_id: ppo_r1_s0, path: runs/full/ppo_r1_s0/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r1_s1, path: runs/full/ppo_r1_s1/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r1_s2, path: runs/full/ppo_r1_s2/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r1_s3, path: runs/full/ppo_r1_s3/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r1_s4, path: runs/full/ppo_r1_s4/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r2_s0, path: runs/full/ppo_r2_s0/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r2_s1, path: runs/full/ppo_r2_s1/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r2_s2, path: runs/full/ppo_r2_s2/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r2_s3, path: runs/full/ppo_r2_s3/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r2_s4, path: runs/full/ppo_r2_s4/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r3_s0, path: runs/full/ppo_r3_s0/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r3_s1, path: runs/full/ppo_r3_s1/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r3_s2, path: runs/full/ppo_r3_s2/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r3_s3, path: runs/full/ppo_r3_s3/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_r3_s4, path: runs/full/ppo_r3_s4/best_model.zip, algo: ppo, obs_mode: full, shield: false}
  - {policy_id: ppo_rstar_shield_s0, path: runs/full/ppo_rstar_shield_s0/best_model.zip, algo: ppo, obs_mode: full, shield: true}
  - {policy_id: ppo_rstar_shield_s1, path: runs/full/ppo_rstar_shield_s1/best_model.zip, algo: ppo, obs_mode: full, shield: true}
  - {policy_id: ppo_rstar_shield_s2, path: runs/full/ppo_rstar_shield_s2/best_model.zip, algo: ppo, obs_mode: full, shield: true}
  - {policy_id: ppo_rstar_shield_s3, path: runs/full/ppo_rstar_shield_s3/best_model.zip, algo: ppo, obs_mode: full, shield: true}
  - {policy_id: ppo_rstar_shield_s4, path: runs/full/ppo_rstar_shield_s4/best_model.zip, algo: ppo, obs_mode: full, shield: true}
pool_seeds: true
primary_policy: ppo_rstar_shield
output_dir: results/test_calibrated

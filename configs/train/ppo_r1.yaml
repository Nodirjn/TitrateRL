# RQ1, phase 1: PPO with reward R1 (time in range), shield off
run_name: ppo_r1
algo: ppo
reward: r1
reward_kwargs: {}
obs_mode: full
shield: false
total_timesteps: 1000000     # 10^6 transitions (days)
n_envs: 8
seed: 0                       # override with --seed 0..4
eval_freq: 50000              # transitions between validation evaluations
selection_scenarios_per_patient: 2
output_dir: runs
ppo:                          # SB3 defaults except the shorter rollout (Table VI)
  learning_rate: 3.0e-4
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  clip_range: 0.2
  gae_lambda: 0.95
  gamma: 0.99
  net_arch: [64, 64]
  activation: tanh

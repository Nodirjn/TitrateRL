# RQ2, phase 2: primary policy, PPO with the selected reward R* and the safety shield.
# R* = R1: highest median validation TIR among rewards meeting the consensus targets in
# >= 90 % of validation patients. Week 11 pilot (selected checkpoints, median validation TIR /
# share meeting targets): R1 60.8 % / 93 %, R2 60.2 % / 90 %, R3 58.1 % / 100 %.
run_name: ppo_rstar_shield
algo: ppo
reward: r1
reward_kwargs: {}
obs_mode: full
shield: true
total_timesteps: 1000000     # 10^6 transitions (days)
n_envs: 8
seed: 0                       # override with --seed 0..4
eval_freq: 50000              # transitions between validation evaluations
selection_scenarios_per_patient: 2
output_dir: runs
ppo:                          # SB3 defaults except the shorter rollout (Table VI)
  learning_rate: 3.0e-4
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  clip_range: 0.2
  gae_lambda: 0.95
  gamma: 0.99
  net_arch: [64, 64]
  activation: tanh

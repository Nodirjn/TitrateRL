[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titraterl"
version = "0.1.0.dev0"
description = "Simulation-based reinforcement learning for personalized basal insulin titration in Type 2 diabetes (in silico research software)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Boburmirzo Uchqunov" },
  { name = "Nodirjon Khabibullaev" },
  { name = "Ibrohim Abralov" },
  { name = "Abdurashid Abdusattarov" },
]
keywords = ["reinforcement learning", "gymnasium", "diabetes", "insulin titration", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14",
  "numba>=0.59",
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "torch>=2.2",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32"]
logging = ["tensorboard>=2.15"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pre-commit>=3.6", "mypy>=1.9"]

[project.scripts]
titraterl = "titraterl.cli:main"

[project.urls]
Documentation = "https://github.com/titraterl/titraterl/tree/main/docs"
Issues = "https://github.com/titraterl/titraterl/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running tests (full cohort, training); deselect with '-m \"not slow\"'",
]

[tool.coverage.run]
source = ["titraterl"]
omit = ["*/cli.py"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
